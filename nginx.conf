server {
    listen 80;
    server_name holz-leads.adindex.agency;

    # Максимальный размер загружаемых файлов (отчетов)
    client_max_body_size 100M;

    # Перенаправление всех HTTP-запросов на HTTPS (раскомментировать после получения SSL-сертификата)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих запросов генерации отчетов (10 минут)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
}

